spring:
  application:
    name: prices
  datasource:
    url: jdbc:h2:mem:prices;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  h2:
    console:
      enabled: true

springdoc:
  swagger-ui:
    url: /openapi.yaml
